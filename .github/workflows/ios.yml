name: ios

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode (26.x on hosted runners)
        # The project file format is 77 (Xcode 16.3+), so the hosted Xcode 26.x opens it; do not commit a 110 upgrade.
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Build
        working-directory: ios
        run: >
          xcodebuild -project BanhApp.xcodeproj -scheme BanhApp
          -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
      - name: Test on the first available iPhone simulator
        working-directory: ios
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,v in sorted(d.items()) if 'iOS' in r for x in v if 'iPhone' in x['name']))")
          xcodebuild -project BanhApp.xcodeproj -scheme BanhApp \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
