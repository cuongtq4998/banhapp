name: backend

on:
  pull_request:
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  # Runs on main are never cancelled: the staging deploy job lives in the same run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Throwaway values; must match the postgres service env below (the services block cannot read the env context).
  CI_DB_USER: ci
  CI_DB_PASSWORD: ci-job-only
  CI_DB_NAME: banh_ci

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-job-only
          POSTGRES_DB: banh_ci
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Compose the throwaway database URL
        run: echo "DATABASE_MIGRATION_URL=${DB_SCHEME}://${CI_DB_USER}:${CI_DB_PASSWORD}@postgres:5432/${CI_DB_NAME}" >> "$GITHUB_ENV"
        env:
          DB_SCHEME: postgres
      - uses: actions/cache@v4
        with:
          path: |
            backend/.build
            contracts/swift/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('backend/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Backend build and unit tests
        working-directory: backend
        run: |
          swift build
          swift test
      - name: Contracts tests
        working-directory: contracts/swift
        run: swift test
      - name: Apply migrations to PostgreSQL
        working-directory: backend
        env:
          APP_ENV: local
          PORT: "8080"
        run: swift run App migrate --yes
      - name: Apply sample seed twice (must be idempotent)
        run: |
          apt-get update -qq && apt-get install -y -qq postgresql-client
          psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f backend/db/seed/sample.sql
          psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f backend/db/seed/sample.sql
      - name: QA package (edge cases and database tests)
        working-directory: backend/Tests/qa
        # Row-mutating QA tests are allowed here because the database is the throwaway service container.
        env:
          QA_ALLOW_DB_MUTATION: "1"
        run: swift test
      - name: Release binary smoke test (shallow and deep health)
        working-directory: backend
        env:
          APP_ENV: local
          PORT: "8081"
        run: |
          swift build -c release
          apt-get install -y -qq curl > /dev/null
          DATABASE_URL="$DATABASE_MIGRATION_URL" "$(swift build -c release --show-bin-path)/App" serve &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:8081/healthz" > /dev/null && break; sleep 1; done
          curl -sf "http://127.0.0.1:8081/healthz" | grep -q '"status":"ok"'
          curl -sf "http://127.0.0.1:8081/healthz?deep=1" | grep -q '"status":"ok"'

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image only (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image on main
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    # Main only. Skips itself until the operator has set the staging secrets.
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    # Never cancel a deploy midway: migrations may have run and the deploy trigger not yet.
    concurrency:
      group: backend-deploy-staging
      cancel-in-progress: false
    env:
      DATABASE_MIGRATION_URL: ${{ secrets.STAGING_DATABASE_MIGRATION_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.STAGING_RENDER_DEPLOY_HOOK_URL }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      IMAGE: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
    steps:
      - name: Check that staging is configured
        id: gate
        run: |
          if [ -z "$DATABASE_MIGRATION_URL" ] || [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging secrets are not set; deploy skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR to pull the image
        if: steps.gate.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run migrations from the new image
        if: steps.gate.outputs.configured == 'true'
        run: docker run --rm -e APP_ENV=staging -e DATABASE_MIGRATION_URL "$IMAGE" migrate --yes
      - name: Trigger staging deploy
        if: steps.gate.outputs.configured == 'true'
        run: curl --fail --silent --show-error -X POST -G --data-urlencode "imgURL=${IMAGE}" "$RENDER_DEPLOY_HOOK_URL"
      - name: Smoke check
        if: steps.gate.outputs.configured == 'true' && env.STAGING_BASE_URL != ''
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent "$STAGING_BASE_URL/healthz" && break
            sleep 10
          done
          # A suspended free-tier database can need longer than one probe deadline to resume.
          for i in $(seq 1 12); do
            curl --fail --silent "$STAGING_BASE_URL/healthz?deep=1" && exit 0
            sleep 10
          done
          exit 1
