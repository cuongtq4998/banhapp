name: android

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gradle version required by AGP 9.4 (android/gradle/libs.versions.toml cites the source).
  GRADLE_VERSION: "9.6.0"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The action's own license step exits 1 on the preview-SDK license prompt; accept explicitly below.
          accept-android-sdk-licenses: false
          packages: ""
      - name: Accept SDK licenses and install platform 37.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build debug
        working-directory: android
        run: gradle :app:assembleDebug
      - name: Unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest
