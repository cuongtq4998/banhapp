# Local PostgreSQL for development (deployment.md section 1). Credentials here
# are throwaway values for a database that only listens on localhost.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: banh
      POSTGRES_PASSWORD: banh_local_only
      POSTGRES_DB: banh
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - banh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banh -d banh"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  banh_pgdata:
