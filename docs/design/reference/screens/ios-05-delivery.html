    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

{\n    super(props);\n    this.state = { day: 1, slot: 1 };\n  }\n  renderVals() {\n    const accent = this.props.accent ?? '#2F6B3F';\n    const dows = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];\n    const base = new Date();\n    const style = (on) => ({\n      on,\n      bg: on ? accent : 'rgba(255,255,255,0.6)',\n      fg: on ? '#FFFFFF' : '#14231A',\n      border: on ? accent : 'rgba(255,255,255,0.85)',\n      shadow: on ? 'inset 0 1px 0 rgba(255,255,255,0.4), 0 4px 12px rgba(47,107,63,0.3)' : 'none',\n    });\n    const days = [1, 2, 3, 4, 5].map((n, i) => {\n      const dt = new Date(base.getFullYear(), base.getMonth(), base.getDate() + n);\n      return { dow: dows[dt.getDay()], num: dt.getDate(), pick: () => this.setState({ day: i }), ...style(this.state.day === i) };\n    });\n    const labels = ['7:00–10:00', '10:00–14:00', '14:00–18:00'];\n    const slots = labels.map((label, i) => ({ label, pick: () => this.setState({ slot: i }), ...style(this.state.slot === i) }));\n    return { accent, days, slots };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
